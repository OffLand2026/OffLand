name: iOS-App bauen

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "icons/**"
      - "ios/**"
      - "scripts/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "icons/**"
      - "ios/**"
      - "scripts/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      testflight:
        description: "Nach TestFlight hochladen (braucht die Apple-Secrets)"
        type: boolean
        default: false
      screentime:
        # Apple hat Family Controls (Distribution) freigegeben (App + 4 Erweiterungen). Darum standardmäßig an,
        # sonst fehlen Bildschirmzeit und Insel-Schutz im nächsten TestFlight-Build.
        description: "Bildschirmzeit-Berechtigung (Family Controls) einbauen"
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

# bash mit pipefail: sonst verschluckt „xcodebuild … | tail“ Fehler und der Lauf wird fälschlich grün
defaults:
  run:
    shell: bash

jobs:
  build:
    name: Bauen (ohne Signatur)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26 auswählen
        # Apple nimmt seit 2026 nur noch Builds mit dem iOS-26-SDK (Xcode 26) an
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi -e beta -e release_candidate | sort -V | tail -n 1 || true)
          if [ -z "$X" ]; then echo "::error::Kein Xcode 26 auf dem Runner gefunden"; ls -d /Applications/Xcode*.app || true; exit 1; fi
          sudo xcode-select -s "$X"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Web-App ins iOS-Projekt kopieren
        run: npm run ios:sync
      - name: App für den Simulator bauen
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40

  testflight:
    name: Nach TestFlight hochladen
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    needs: build
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Apple-Secrets prüfen
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v fehlt. Siehe docs/testflight.md"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - name: Xcode 26 auswählen
        # Apple nimmt seit 2026 nur noch Builds mit dem iOS-26-SDK (Xcode 26) an
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi -e beta -e release_candidate | sort -V | tail -n 1 || true)
          if [ -z "$X" ]; then echo "::error::Kein Xcode 26 auf dem Runner gefunden"; ls -d /Applications/Xcode*.app || true; exit 1; fi
          sudo xcode-select -s "$X"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ios:sync
      - name: Bildschirmzeit-Berechtigung einbauen
        if: inputs.screentime
        run: |
          for f in ios/App/App/App.entitlements ios/App/ScreenTimeMonitor/ScreenTimeMonitor.entitlements ios/App/ScreenTimeReport/ScreenTimeReport.entitlements ios/App/ShieldConfig/ShieldConfig.entitlements ios/App/ShieldAction/ShieldAction.entitlements; do
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.family-controls bool true" "$f"
          done
      - name: API-Schlüssel ablegen
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
      - name: Verwaiste CI-Zertifikate aufräumen
        # Jeder Lauf erzeugt ein neues Entwickler-Zertifikat („Created via API“), dessen Schlüssel
        # mit dem Runner verschwindet. Ohne Aufräumen ist nach ein paar Builds Apples Höchstzahl erreicht.
        continue-on-error: true
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/keys/AuthKey.p8
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q pyjwt cryptography
          "$RUNNER_TEMP/venv/bin/python" scripts/asc-cleanup-certs.py
      - name: Archiv bauen und signieren
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/OffLand.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tail -n 60
      - name: Zu App Store Connect / TestFlight hochladen
        run: |
          sed "s/TEAM_ID/$APPLE_TEAM_ID/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OffLand.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 40
      - name: Berechtigungen der fertigen App anzeigen
        # Zweiter Export nur als Datei (ohne Upload), damit man die echten Entitlements jeder
        # Erweiterung sieht, z. B. ob die App-Gruppe für das Widget drin ist
        continue-on-error: true
        run: |
          sed -e "s/TEAM_ID/$APPLE_TEAM_ID/" -e "s#<string>upload</string>#<string>export</string>#" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportLocal.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OffLand.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportLocal.plist" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 5
          cd "$RUNNER_TEMP/ipa"
          unzip -q -o ./*.ipa -d x
          {
            echo "### Berechtigungen der hochgeladenen Version"
            echo '```'
            for b in x/Payload/*.app x/Payload/*.app/PlugIns/*.appex x/Payload/*.app/Extensions/*.appex; do
              [ -e "$b" ] || continue
              echo "== ${b#x/Payload/}"
              codesign -d --entitlements - --xml "$b" > "$RUNNER_TEMP/ent.plist" 2>/dev/null || true
              plutil -p "$RUNNER_TEMP/ent.plist" || true
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Schlüssel löschen
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
