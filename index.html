<!doctype html>

<head>
<meta charset="utf-8">
<script>
  // offlandapp.com: Neue Besucher sehen zuerst die Website. Direkt in die App geht es mit Insel auf dem Gerät,
  // vom Home-Bildschirm, mit Einladungs- oder Umzugslink oder über „Ausprobieren“ auf der Website (?app).
  (function(){try{
    if(!/(^|\.)offlandapp\.com$/.test(location.hostname))return;
    var q=location.search,h=location.hash,ss=sessionStorage;
    if(/(^|[?&])app\b/.test(q))ss.setItem("offland-app","1");
    var standalone=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone;
    var hasIsland=(JSON.parse(localStorage.getItem("offline-insel-profile")||"[]")||[]).length>0;
    if(standalone||hasIsland||q||h||ss.getItem("offland-app"))return;
    location.replace("landing/");
  }catch(e){}})();
</script>

<!-- Ladebildschirm: liegt über allem, bis die App bereit ist. Gleiches Motiv und gleiche Position wie der iOS-Startbildschirm. -->
<div id="splash">
  <style>
    /* Startanimation: Das Handy geht aus, der Bildschirm wird zum Horizont, die Insel taucht auf, Mr. Bay und Lucifer kommen.
       Beim ersten Öffnen die volle Fassung (ca. 6,5 s, überspringbar), danach ab dem Meer (ca. 3 s). Testen: ?intro=full / ?intro=short */
    #splash{position:fixed;inset:0;z-index:9999;pointer-events:none;overflow:hidden;background:#000;--k:1;--off:0;transition:opacity .8s ease,transform .8s ease}
    #splash>svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
    #splash.out{opacity:0;transform:scale(1.06)}
    #splash.to-b{transition:none;animation:spPan 1.15s cubic-bezier(.65,0,.25,1) forwards}
    @keyframes spPan{to{transform:translateY(-100%)}}
    #splash .sp-skip{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));pointer-events:auto;cursor:pointer;
      font:700 13px/1 Manrope,system-ui,sans-serif;color:#F3F1EA;background:rgba(243,241,234,.12);border:0;border-radius:999px;padding:9px 14px;opacity:0;animation:spxSkipIn .4s 1.2s both}
    #splash .sp-skip:focus-visible{outline:2px solid #B6A4FF;outline-offset:2px}
    @keyframes spxSkipIn{to{opacity:1}}
    /* ---------- Szene ---------- */
    #splash .a,#splash .luc-tail,#splash .bay-wave,#splash .blink{transform-box:fill-box}
    #splash .a{animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.7,.2,1)}
    #splash:not(.play) .a{animation:none!important}
    /* Zeitpunkte in Sekunden; --k = Tempo, --off = so viele Sekunden am Anfang überspringen (Kurzfassung) */
    #splash .d{animation-duration:calc(var(--dur)*var(--k)*1s);animation-delay:calc((var(--at) - var(--off))*var(--k)*1s)}
    /* 1. Handy leuchtet, Mitteilungen ploppen */
    #splash #spPhone{animation-name:spxPhIn;transform-origin:center}
    @keyframes spxPhIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
    #splash .badge{animation-name:spxPop;transform-origin:center}
    @keyframes spxPop{0%{opacity:0;transform:scale(0)}60%{transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
    #splash #spBanner{animation-name:spxDrop}
    @keyframes spxDrop{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:none}}
    #splash #spGlow{animation-name:spxGlowOut}
    @keyframes spxGlowOut{0%{opacity:0}15%{opacity:1}85%{opacity:1}100%{opacity:0}}
    /* 2. Bildschirm geht aus wie ein alter Fernseher */
    #splash #spScr{animation-name:spxCrt;transform-origin:center}
    @keyframes spxCrt{0%{transform:none;filter:brightness(1)}55%{transform:scale(1,.012);filter:brightness(3)}100%{transform:scale(.0,.012);filter:brightness(3)}}
    #splash #spBody{animation-name:spxFade}
    @keyframes spxFade{to{opacity:0}}
    #splash #spHorizon{transform-origin:center;animation:spxHz calc(.45s*var(--k)) calc((1.78s - var(--off)*1s)*var(--k)) both,spxFade calc(.6s*var(--k)) calc((2.5s - var(--off)*1s)*var(--k)) forwards}
    @keyframes spxHz{0%{opacity:0;transform:scaleX(.02)}20%{opacity:1}100%{opacity:1;transform:scaleX(1)}}
    /* 3. Meer und Himmel */
    #splash #spSea{animation-name:spxSeaIn;transform-origin:top}
    @keyframes spxSeaIn{from{transform:scaleY(0)}to{transform:none}}
    #splash #spSky{animation-name:spxSkyIn}
    @keyframes spxSkyIn{from{opacity:0}to{opacity:1}}
    #splash .star{animation-name:spxTw}
    @keyframes spxTw{from{opacity:0}to{opacity:.9}}
    #splash #spMoon{animation-name:spxMoonUp}
    @keyframes spxMoonUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
    /* 4. Insel taucht auf */
    #splash #spIsle{animation-name:spxRise;animation-timing-function:cubic-bezier(.22,1.25,.36,1)}
    @keyframes spxRise{from{transform:translateY(150px)}to{transform:none}}
    #splash .ring{animation-name:spxRing;transform-origin:center}
    @keyframes spxRing{0%{opacity:0;transform:scale(.4)}8%{opacity:.8}100%{opacity:0;transform:scale(1.7)}}
    #splash .splash-drop{animation-name:spxDropUp;transform-origin:center}
    @keyframes spxDropUp{0%{opacity:0;transform:translateY(10px)}30%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}
    /* 5. Bewohnerin und Lucifer laufen rein */
    #splash #spWalker{animation-name:spxWalkIn;animation-timing-function:cubic-bezier(.3,.6,.3,1)}
    @keyframes spxWalkIn{from{opacity:0;transform:translateX(-230px)}20%{opacity:1}to{transform:none}}
    #splash #spWalkerBob{animation-name:spxBob;animation-iteration-count:5;animation-timing-function:ease-in-out}
    @keyframes spxBob{0%,100%{transform:none}50%{transform:translateY(-5px)}}
    #splash #spCat{animation-name:spxCatIn;animation-timing-function:cubic-bezier(.3,.6,.3,1)}
    @keyframes spxCatIn{from{opacity:0;transform:translateX(-260px)}20%{opacity:1}to{transform:none}}
    #splash .bay-wave{animation:spxWaveHi calc(.42s*var(--k)) ease-in-out calc((4.75s - var(--off)*1s)*var(--k)) 3 both;transform-origin:0% 100%}
    @keyframes spxWaveHi{0%,100%{transform:rotate(0)}50%{transform:rotate(-28deg)}}
    #splash .luc-tail{animation:spxTail 1.6s ease-in-out infinite;transform-origin:0% 100%}
    #splash .blink{animation:spxBlink 4s infinite;transform-origin:center}
    @keyframes spxBlink{0%,94%,100%{transform:none}97%{transform:scaleY(.1)}}
    @keyframes spxTail{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
    #splash #spHearts{animation-name:spxPop;transform-origin:center}
    /* 6. Name */
    #splash #spWord{animation-name:spxWordUp}
    @keyframes spxWordUp{from{opacity:0;transform:translateY(16px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
    #splash #spTag{animation-name:spxWordUp}
    #splash .wavelet{animation:spxWl 3s ease-in-out infinite}
    @keyframes spxWl{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}
    @media (prefers-reduced-motion:reduce){
      #splash .a{animation-duration:1ms!important;animation-delay:0s!important}
      #splash .luc-tail,#splash .wavelet,#splash .blink,#splash .bay-wave{animation:none!important}
    }
  </style>

<script>
  // Ausblenden, sobald die App bereit ist und die Animation durch ist (spätestens nach 6 s bzw. 9 s beim ersten Mal)
  (function(){var t0=Date.now(),el=document.getElementById("splash"),q=location.search,skip=el.querySelector(".sp-skip");
    function seen(){try{return localStorage.getItem("offland-intro")==="1"}catch(e){return true}}
    var full=/intro=full/.test(q)||(!/intro=short/.test(q)&&!navigator.webdriver&&!seen());
    var minT=full?6300:3000,maxT=full?9000:6500;
    // Kurzfassung: ab dem Meer (Handy-Teil übersprungen), in ruhigem Tempo
    el.style.setProperty("--k",full?"1":".75");el.style.setProperty("--off",full?"0":"2.3");el.classList.add("play");
    if(full){try{localStorage.setItem("offland-intro","1")}catch(e){}}else skip.style.display="none";
    skip.addEventListener("click",function(){minT=0;skip.style.display="none"});
    function rm(){el&&el.remove();el=null}
    function done(){if(!el)return;var b=document.body;
      // Läuft der Anmeldebildschirm dahinter, fährt die Kamera nach oben und er kommt von unten herein
      if(b.classList.contains("start")&&!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)){
        b.classList.add("enter-b");el.classList.add("to-b");setTimeout(rm,1250);setTimeout(function(){b.classList.remove("enter-b")},3200);return}
      el.classList.add("out");setTimeout(rm,850)}
    (function wait(){if(!el)return;var ok=window.__offlandReady&&(!document.fonts||document.fonts.status==="loaded");
      if(ok&&Date.now()-t0>=minT||Date.now()-t0>maxT)return done();requestAnimationFrame(wait)})();
    setTimeout(done,maxT+500);   // auch wenn requestAnimationFrame im Hintergrund pausiert
  })();
</script>


<script>
  // Fehler beim Start merken, falls die App selbst gar nicht lädt; die App reicht sie beim nächsten Start nach
  addEventListener("error",function(e){if(window.__offlandReady)return;try{var k="offland-errors",q=JSON.parse(localStorage.getItem(k)||"[]");if(q.length<20){q.push({msg:String(e.message||"Fehler beim Start").slice(0,300),src:String((e.filename||"").split(location.origin).join(""))+":"+(e.lineno||0),stack:String(e.error&&e.error.stack||"").slice(0,1200),v:"start",p:"web",at:Date.now()});localStorage.setItem(k,JSON.stringify(q))}}catch(x){}});
</script>
