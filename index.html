<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14151F">
<meta name="description" content="OffLand – Grow your world beyond the screen. Weniger Bildschirmzeit, glücklichere Insel.">
<title>OffLand – Grow your world beyond the screen</title>
<meta name="apple-mobile-web-app-title" content="OffLand">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="start">
<div id="start"></div>

<div class="app" id="app">
  <div class="head">
    <div>
      <p class="small muted" id="dateline" style="white-space:nowrap">OffLand</p>
      <h1 id="title">Deine Insel</h1>
    </div>
    <div class="row" style="gap:8px">
      <span class="chip good" id="streakChip">Tag 0</span>
      <button class="accbtn" id="accBtn" aria-label="Konto und Einstellungen"></button>
    </div>
  </div>
  <div class="scene" id="scene"></div>
  <main id="view"><div class="card"><p class="muted">Insel wird geladen …</p></div></main>
</div>

<div class="tabs"><nav aria-label="Hauptmenü" id="tabs">
  <button data-tab="heute" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Heute</button>
  <button data-tab="bewohner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-4 3-6 6-6s6 2 6 6M15 20c0-3 1.5-5 4-5"/></svg>Bewohner</button>
  <button data-tab="zeit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10M7 21h10M8 3c0 5 8 5 8 9s-8 4-8 9M16 3c0 5-8 5-8 9"/></svg>Zeit</button>
  <button data-tab="projekt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V10l7-5 7 5v11M10 21v-6h4v6"/></svg>Bauen</button>
  <button data-tab="freunde"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8M10 17h4v3h-4z"/></svg>Freunde</button>
  <button data-tab="verlauf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5h7a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-5a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h5z"/></svg>Album</button>
</nav></div>

<div id="modalRoot"></div>

<!-- Ladebildschirm: liegt über allem, bis die App bereit ist. Gleiches Motiv und gleiche Position wie der iOS-Startbildschirm. -->
<div id="splash" aria-hidden="true">
  <style>
    #splash{position:fixed;inset:0;z-index:9999;pointer-events:none;overflow:hidden;background:radial-gradient(120vh 90vh at 50% 38%,#26305A 0%,#1B2340 38%,#14151F 78%);transition:opacity .55s ease,transform .55s ease}
    #splash.out{opacity:0;transform:scale(1.04)}
    #splash .sp-portal{position:absolute;left:50%;top:45.75%;width:min(22vh,64vw);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:24%;overflow:hidden;box-shadow:0 0 0 1.5px rgba(182,164,255,.25),0 18px 60px rgba(0,0,0,.45),0 0 90px rgba(182,164,255,.18);animation:spFloat 4s ease-in-out infinite}
    #splash .sp-portal svg{width:100%;height:100%;display:block}
    #splash .sp-glow{position:absolute;left:50%;top:45.75%;width:min(44vh,120vw);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(200,241,105,.16),rgba(182,164,255,.08) 45%,transparent 70%);animation:spPulse 3.2s ease-in-out infinite}
    #splash .sp-name{position:absolute;left:0;right:0;top:62.2%;transform:translateY(-50%);text-align:center;font:800 min(5.5vh,15vw)/1 'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;letter-spacing:-.02em;color:#F3F1EA}
    #splash .sp-name em{font-style:normal;color:#C8F169}
    #splash .sp-tag{position:absolute;left:0;right:0;top:calc(62.2% + 4.6vh);text-align:center;font:600 min(2vh,4.2vw)/1.3 Manrope,system-ui,sans-serif;color:#A4A6BD;opacity:0;animation:spIn .7s .35s ease-out forwards}
    #splash .sp-bar{position:absolute;left:50%;bottom:calc(9vh + env(safe-area-inset-bottom,0px));width:min(30vw,140px);height:4px;transform:translateX(-50%);border-radius:2px;background:rgba(243,241,234,.1);overflow:hidden;opacity:0;animation:spIn .5s .6s ease-out forwards}
    #splash .sp-bar i{position:absolute;top:0;bottom:0;width:40%;border-radius:2px;background:linear-gradient(90deg,transparent,#C8F169,transparent);animation:spSlide 1.3s ease-in-out infinite}
    #splash .sp-star{position:absolute;width:3px;height:3px;border-radius:50%;background:#F3F1EA;animation:spTw 2.6s ease-in-out infinite}
    #splash .sp-wave{animation:spWave 3.5s ease-in-out infinite}
    #splash .sp-moon{animation:spMoon 4s ease-in-out infinite;transform-origin:400px 110px}
    #splash .sp-bob{animation:spBob 3s ease-in-out infinite}
    @keyframes spFloat{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-53%)}}
    @keyframes spPulse{0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(.96)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}}
    @keyframes spIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    #splash .sp-bar{animation-name:spInBar}
    @keyframes spInBar{from{opacity:0}to{opacity:1}}
    @keyframes spSlide{from{left:-40%}to{left:100%}}
    @keyframes spTw{0%,100%{opacity:.15}50%{opacity:.9}}
    @keyframes spWave{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
    @keyframes spMoon{0%,100%{opacity:.85}50%{opacity:1}}
    @keyframes spBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @media (prefers-reduced-motion:reduce){#splash *,#splash{animation:none!important}#splash .sp-tag,#splash .sp-bar{opacity:1}}
  </style>
  <i class="sp-star" style="left:12%;top:14%"></i><i class="sp-star" style="left:28%;top:7%;animation-delay:.8s"></i><i class="sp-star" style="left:71%;top:11%;animation-delay:1.6s"></i>
  <i class="sp-star" style="left:86%;top:22%;animation-delay:.4s"></i><i class="sp-star" style="left:18%;top:31%;animation-delay:2s"></i><i class="sp-star" style="left:80%;top:76%;animation-delay:1.1s"></i>
  <i class="sp-star" style="left:9%;top:68%;animation-delay:2.3s"></i><i class="sp-star" style="left:58%;top:84%;animation-delay:.6s"></i>
  <div class="sp-glow"></div>
  <div class="sp-portal"><svg viewBox="0 0 512 512">
    <defs><linearGradient id="spSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B2340"/><stop offset="1" stop-color="#2B3566"/></linearGradient></defs>
    <rect width="512" height="512" fill="url(#spSky)"/>
    <g fill="#F3F1EA"><circle class="sp-star-s" cx="90" cy="96" r="6"/><circle cx="200" cy="70" r="5"/><circle cx="300" cy="120" r="4"/><circle cx="60" cy="190" r="3"/></g>
    <g class="sp-moon"><circle cx="400" cy="110" r="70" fill="#F3F1EA" opacity=".08"/><circle cx="400" cy="110" r="42" fill="#F3F1EA"/><circle cx="420" cy="96" r="40" fill="#1E2748"/></g>
    <rect y="340" width="512" height="172" fill="#24375A"/>
    <g class="sp-bob">
      <ellipse cx="256" cy="350" rx="190" ry="36" fill="#E9D7A6"/>
      <path d="M90 344c18-80 90-116 166-116s148 36 166 116z" fill="#7FC57A"/>
      <rect x="150" y="232" width="14" height="70" rx="5" fill="#8A5A3B"/><circle cx="157" cy="218" r="40" fill="#4E9A58"/>
      <path d="M280 330v-60l50-38 50 38v60z" fill="#F3F1EA"/>
      <path d="M270 274l60-46 60 46" fill="none" stroke="#FF9C7A" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="316" y="290" width="28" height="40" rx="5" fill="#FFD27A"/>
    </g>
    <g class="sp-wave" stroke="#3A5683" stroke-width="8" stroke-linecap="round"><path d="M60 410h80M300 440h100M150 470h70"/></g>
  </svg></div>
  <div class="sp-name">Off<em>Land</em></div>
  <div class="sp-tag">Weniger Handy. Mehr Insel.</div>
  <div class="sp-bar"><i></i></div>
</div>
<script>
  // Ausblenden, sobald die App bereit ist: frühestens nach 0,9 s (kein Flackern), spätestens nach 6 s
  (function(){var t0=Date.now(),el=document.getElementById("splash");
    function done(){if(!el)return;el.classList.add("out");setTimeout(function(){el&&el.remove();el=null},600)}
    (function wait(){if(!el)return;var ok=window.__offlandReady&&(!document.fonts||document.fonts.status==="loaded");
      if(ok&&Date.now()-t0>=900||Date.now()-t0>6000)return done();requestAnimationFrame(wait)})();
    setTimeout(done,6500);   // auch wenn requestAnimationFrame im Hintergrund pausiert
  })();
</script>


<script>
  // Fehler beim Start merken, falls die App selbst gar nicht lädt; die App reicht sie beim nächsten Start nach
  addEventListener("error",function(e){if(window.__offlandReady)return;try{var k="offland-errors",q=JSON.parse(localStorage.getItem(k)||"[]");if(q.length<20){q.push({msg:String(e.message||"Fehler beim Start").slice(0,300),src:String((e.filename||"").split(location.origin).join(""))+":"+(e.lineno||0),stack:String(e.error&&e.error.stack||"").slice(0,1200),v:"start",p:"web",at:Date.now()});localStorage.setItem(k,JSON.stringify(q))}}catch(x){}});
</script>
<script src="js/online-config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
